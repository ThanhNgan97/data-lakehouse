apiVersion: apps/v1
kind: Deployment
metadata:
  name: windows-dependencies-proxy
  namespace: lakehouse-spark
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: windows-dependencies-proxy
  template:
    metadata:
      labels:
        app: windows-dependencies-proxy
    spec:
      hostNetwork: true
      # MagicDNS is reachable at this stable Tailscale resolver. The VM's
      # resolv.conf points at a gateway that containers cannot use for it.
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 100.100.100.100
      nodeSelector:
        kubernetes.io/hostname: cusclakehouse
      containers:
        - name: socat
          image: alpine/socat:1.8.1.3
          command: ["/bin/sh", "-ec"]
          args:
            - |
              socat TCP-LISTEN:9878,fork,reuseaddr TCP:dylan.tail2f6d62.ts.net:9878 &
              socat TCP-LISTEN:19120,fork,reuseaddr TCP:dylan.tail2f6d62.ts.net:19120 &
              socat TCP-LISTEN:5433,fork,reuseaddr TCP:dylan.tail2f6d62.ts.net:5433 &
              wait
          ports:
            - name: ozone-s3
              containerPort: 9878
            - name: nessie
              containerPort: 19120
            - name: postgres
              containerPort: 5433
---
apiVersion: v1
kind: Service
metadata:
  name: windows-dependencies
  namespace: lakehouse-spark
spec:
  selector:
    app: windows-dependencies-proxy
  ports:
    - name: ozone-s3
      port: 9878
      targetPort: ozone-s3
    - name: nessie
      port: 19120
      targetPort: nessie
    - name: postgres
      port: 5433
      targetPort: postgres
