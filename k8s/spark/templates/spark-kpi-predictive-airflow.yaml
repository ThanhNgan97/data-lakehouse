apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: kpi-predict-{{ ts_nodash | lower }}-{{ ti.try_number }}
  namespace: lakehouse-spark
spec:
  type: Python
  mode: cluster
  image: docker.io/tdang2202/cusc-datalakehouse:spark-3.5.0-v3
  imagePullPolicy: Always
  mainApplicationFile: local:///opt/lakehouse/spark/spark_predictive_analysis.py
  sparkVersion: "3.5.0"
  sparkConf:
    spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.projectnessie.spark.extensions.NessieSparkSessionExtensions
    spark.sql.catalog.lakehouse: org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.lakehouse.catalog-impl: org.apache.iceberg.nessie.NessieCatalog
    spark.sql.catalog.lakehouse.uri: http://host.docker.internal:19120/api/v1
    spark.sql.catalog.lakehouse.ref: main
    spark.sql.catalog.lakehouse.warehouse: s3a://university-lakehouse/iceberg-warehouse
    spark.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.endpoint: http://host.docker.internal:9878
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.hadoop.fs.s3a.aws.credentials.provider: com.amazonaws.auth.EnvironmentVariableCredentialsProvider
    spark.sql.shuffle.partitions: "4"
  driver:
    labels:
      app.kubernetes.io/managed-by: airflow
    cores: 1
    memory: 1g
    serviceAccount: spark-operator-spark
    env:
      - {name: SPARK_EXTRA_JARS_DIR, value: /opt/spark/jars}
      - {name: S3_ENDPOINT, value: "http://host.docker.internal:9878"}
      - {name: S3_BUCKET_NAME, value: university-lakehouse}
      - {name: ICEBERG_WAREHOUSE, value: "s3a://university-lakehouse/iceberg-warehouse"}
      - {name: NESSIE_API_URL, value: "http://host.docker.internal:19120/api/v1"}
      - {name: S3_ACCESS_KEY, valueFrom: {secretKeyRef: {name: ozone-s3-credentials, key: access-key}}}
      - {name: S3_SECRET_KEY, valueFrom: {secretKeyRef: {name: ozone-s3-credentials, key: secret-key}}}
      - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: ozone-s3-credentials, key: access-key}}}
      - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: ozone-s3-credentials, key: secret-key}}}
  executor:
    labels:
      app.kubernetes.io/managed-by: airflow
    instances: 2
    cores: 1
    memory: 1g
    env:
      - {name: AWS_ACCESS_KEY_ID, valueFrom: {secretKeyRef: {name: ozone-s3-credentials, key: access-key}}}
      - {name: AWS_SECRET_ACCESS_KEY, valueFrom: {secretKeyRef: {name: ozone-s3-credentials, key: secret-key}}}
  restartPolicy: {type: Never}
