services:
  # PostgreSQL + TimescaleDB
  postgres:
    restart: unless-stopped
    image: timescale/timescaledb@sha256:6343bdc87ca132c6b53acb26113a6bad1821d188fa39975a745f32ddd9757634
    container_name: demo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: university_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - lakehouse-network

  # Kafka
  kafka:
    restart: unless-stopped
    image: apache/kafka:4.1.1
    container_name: demo-kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports:
      - "9094:9094"
    networks:
      - lakehouse-network

  # MinIO
  minio:
    restart: "no"
    image: minio/minio@sha256:14cea493d9a34af32f524e538b8346cf79f3321eff8e708c1e2960462bd8936e
    container_name: demo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - lakehouse-network

  # Khởi tạo bucket
  minio-init:
    image: minio/mc@sha256:a7fe349ef4bd8521fb8497f55c6042871b2ae640607cf99d9bede5e9bdf11727
    container_name: demo-minio-init
    depends_on:
      - minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-university-lakehouse}
    networks:
      - lakehouse-network
    entrypoint: >
      /bin/sh -c "
      set -e;
      attempt=0;
      until (/usr/bin/mc alias set myminio http://minio:9000 "$${MINIO_ROOT_USER}" "$${MINIO_SECRET_KEY}"); do
        attempt=$$((attempt + 1));
        if [ "$$attempt" -ge 60 ]; then
          echo 'MinIO alias initialization failed' >&2;
          exit 1;
        fi;
        echo 'Waiting for MinIO...';
        sleep 2;
      done;
      if ! /usr/bin/mc stat "myminio/$${MINIO_BUCKET_NAME}" > /dev/null 2>&1; then
        /usr/bin/mc mb "myminio/$${MINIO_BUCKET_NAME}";
        echo 'Bucket initialized';
      else
        echo 'Bucket already exists';
      fi;
      /usr/bin/mc stat "myminio/$${MINIO_BUCKET_NAME}" > /dev/null;
      echo 'Bucket ready';
      exit 0;
      "

  # Trino
  trino:
    environment:
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
    restart: unless-stopped
    image: trinodb/trino:435
    container_name: demo-trino
    ports:
      - "8081:8080"
    volumes:
      - ./lakehouse/trino/catalog:/etc/trino/catalog
    depends_on:
      - minio
    networks:
      - lakehouse-network


# Thêm Project Nessie (Iceberg Catalog)
# Thêm Project Nessie (Iceberg Catalog)
  nessie:
    restart: unless-stopped
    image: ghcr.io/projectnessie/nessie:0.104.5  # <-- Đã thêm ghcr.io/ vào đây
    container_name: demo-nessie
    ports:
      - "19120:19120"
    environment:
      - QUARKUS_PROFILE=prod
      - NESSIE_VERSION_STORE_TYPE=JDBC
      - QUARKUS_DATASOURCE_DB_KIND=postgresql
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/nessie_db
      - QUARKUS_DATASOURCE_USERNAME=postgres
      - QUARKUS_DATASOURCE_PASSWORD=${PG_PASSWORD}
    depends_on:
      - postgres
    networks:
      - lakehouse-network

  # Apache Superset
  superset:
    restart: unless-stopped
    image: apache/superset:3.1.0
    container_name: demo-superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    user: "root"
    volumes:
      - superset_home:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py
    command: >
      sh -c "
      pip install trino sqlalchemy-trino &&
      superset db upgrade &&
      superset fab create-admin
      --username admin
      --firstname Admin
      --lastname User
      --email admin@fab.org
      --password admin &&
      superset init &&
      /usr/bin/run-server.sh
      "
    depends_on:
      - trino
    networks:
      - lakehouse-network

  # Airflow Init
  airflow-init:
    build:
      context: .
      dockerfile: airflow.Dockerfile
    image: custom-airflow:2.9.2
    container_name: demo-airflow-init
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${PG_PASSWORD}@postgres:5432/airflow_db
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    command: version
    depends_on:
      - postgres
    networks:
      - lakehouse-network

  # Airflow Webserver
  airflow-webserver:
    restart: unless-stopped
    image: custom-airflow:2.9.2
    container_name: demo-airflow-webserver
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${PG_PASSWORD}@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      AIRFLOW__WEBSERVER__WEB_SERVER_SESSION_LIFETIME: '604800'
      AIRFLOW__WEBSERVER__SESSION_COOKIE_SAMESITE: 'None'
      AIRFLOW__WEBSERVER__SESSION_COOKIE_SECURE: 'False'
      MINIO_ENDPOINT: 'http://minio:9000'
      NESSIE_API_URL: 'http://nessie:19120/api/v1'
    volumes:
      - ./lakehouse/dags:/opt/airflow/dags
      - ./lakehouse/spark:/opt/airflow/spark
      - ./.env:/opt/airflow/.env
    command: webserver
    depends_on:
      postgres:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    networks:
      - lakehouse-network

  # Airflow Scheduler
  airflow-scheduler:
    restart: unless-stopped
    image: custom-airflow:2.9.2
    container_name: demo-airflow-scheduler
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${PG_PASSWORD}@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      MINIO_ENDPOINT: 'http://minio:9000'
      NESSIE_API_URL: 'http://nessie:19120/api/v1'
    volumes:
      - ./lakehouse/dags:/opt/airflow/dags
      - ./lakehouse/spark:/opt/airflow/spark
      - ./.env:/opt/airflow/.env
    command: scheduler
    depends_on:
      postgres:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
    networks:
      - lakehouse-network

volumes:
  postgres_data:
  minio_data:
  superset_home:

networks:
  lakehouse-network:
    driver: bridge