# Opt-in overlay; use together with the two newdirection Compose files.
services:
  dbt-worker:
    profiles: [dbt]
    image: lakehouse-dbt-runtime:core1.9.8-trino1.9.3
    build:
      context: ./lakehouse/dbt/runtime
    restart: unless-stopped
    cpuset: '0,1'
    mem_limit: 512m
    memswap_limit: 512m
    command: [python, /service/worker.py]
    volumes:
      - ./lakehouse/dbt/service:/service:ro
      - ./lakehouse/dbt/api_gold:/project:ro
      - ./lakehouse/spark/dbt_gold_contract.py:/contract/dbt_gold_contract.py:ro
      - ./.runtime/dbt-integration/jobs:/artifacts
    environment:
      DBT_TRINO_HOST: trino
      DBT_TRINO_PORT: '8080'
      NESSIE_API_URL: http://nessie:19120/api/v1
      S3_ENDPOINT: http://s3g:9878
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:?Provide the existing Ozone access key}
      S3_SECRET_KEY: ${S3_SECRET_KEY:?Provide the existing Ozone secret key}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-university-lakehouse}
      S3_REGION: ${S3_REGION:-us-east-1}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [lakehouse-network]
