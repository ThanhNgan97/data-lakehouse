x-ozone-image: &ozone-image
  image: apache/ozone@sha256:38ec1fda4ae7dceeb4e2accf16182acb99cdf33d80b78ec408957fce41adcec7

x-ozone-config: &ozone-config
  OZONE-SITE.XML_hdds.datanode.dir: /data/hdds
  OZONE-SITE.XML_ozone.metadata.dirs: /data/metadata
  OZONE-SITE.XML_ozone.om.address: om
  OZONE-SITE.XML_ozone.om.http-address: om:9874
  OZONE-SITE.XML_ozone.recon.address: recon:9891
  OZONE-SITE.XML_ozone.recon.db.dir: /data/metadata/recon
  OZONE-SITE.XML_ozone.replication: "3"
  OZONE-SITE.XML_ozone.scm.block.client.address: scm
  OZONE-SITE.XML_ozone.scm.client.address: scm
  OZONE-SITE.XML_ozone.scm.datanode.id.dir: /data/metadata
  OZONE-SITE.XML_ozone.scm.names: scm
  no_proxy: om,recon,scm,s3g,localhost,127.0.0.1

services:
  # PostgreSQL + TimescaleDB
  postgres:
    restart: unless-stopped
    image: timescale/timescaledb@sha256:6343bdc87ca132c6b53acb26113a6bad1821d188fa39975a745f32ddd9757634
    container_name: demo-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: university_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d
    networks:
      - lakehouse-network

  # Kafka
  kafka:
    restart: unless-stopped
    image: apache/kafka:4.1.1
    container_name: demo-kafka
    hostname: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:19092,PLAINTEXT_HOST://:9094
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:19092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports:
      - "9094:9094"
    networks:
      - lakehouse-network

  # Apache Ozone distributed object storage
  scm:
    <<: *ozone-image
    restart: unless-stopped
    container_name: demo-ozone-scm
    command: ["ozone", "scm"]
    environment:
      <<: *ozone-config
      ENSURE_SCM_INITIALIZED: /data/metadata/scm/current/VERSION
    ports:
      - "9876:9876"
    volumes:
      - ozone_scm_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9876/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - lakehouse-network

  om:
    <<: *ozone-image
    restart: unless-stopped
    container_name: demo-ozone-om
    command: ["ozone", "om"]
    environment:
      <<: *ozone-config
      CORE-SITE.XML_hadoop.proxyuser.hadoop.hosts: "*"
      CORE-SITE.XML_hadoop.proxyuser.hadoop.groups: "*"
      ENSURE_OM_INITIALIZED: /data/metadata/om/current/VERSION
      WAITFOR: scm:9876
    ports:
      - "9874:9874"
    volumes:
      - ozone_om_data:/data
    depends_on:
      scm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9874/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - lakehouse-network

  datanode-1:
    <<: *ozone-image
    restart: unless-stopped
    container_name: demo-ozone-datanode-1
    command: ["ozone", "datanode"]
    environment:
      <<: *ozone-config
      WAITFOR: scm:9876
    volumes:
      - ozone_datanode_1_data:/data
    depends_on:
      scm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "jps -l | grep -q org.apache.hadoop.ozone.HddsDatanodeService"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - lakehouse-network

  datanode-2:
    <<: *ozone-image
    restart: unless-stopped
    container_name: demo-ozone-datanode-2
    command: ["ozone", "datanode"]
    environment:
      <<: *ozone-config
      WAITFOR: scm:9876
    volumes:
      - ozone_datanode_2_data:/data
    depends_on:
      scm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "jps -l | grep -q org.apache.hadoop.ozone.HddsDatanodeService"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - lakehouse-network

  datanode-3:
    <<: *ozone-image
    restart: unless-stopped
    container_name: demo-ozone-datanode-3
    command: ["ozone", "datanode"]
    environment:
      <<: *ozone-config
      WAITFOR: scm:9876
    volumes:
      - ozone_datanode_3_data:/data
    depends_on:
      scm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "jps -l | grep -q org.apache.hadoop.ozone.HddsDatanodeService"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - lakehouse-network

  recon:
    <<: *ozone-image
    restart: unless-stopped
    container_name: demo-ozone-recon
    command: ["ozone", "recon"]
    environment:
      <<: *ozone-config
      WAITFOR: scm:9876
    ports:
      - "9888:9888"
    volumes:
      - ozone_recon_data:/data
    depends_on:
      scm:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9888/ >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - lakehouse-network

  s3g:
    <<: *ozone-image
    restart: unless-stopped
    container_name: demo-ozone-s3g
    command: ["ozone", "s3g"]
    environment:
      <<: *ozone-config
      WAITFOR: om:9874
    ports:
      - "9878:9878"
    depends_on:
      om:
        condition: service_healthy
      datanode-1:
        condition: service_healthy
      datanode-2:
        condition: service_healthy
      datanode-3:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "code=$$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:9878/); test \"$$code\" = 200 -o \"$$code\" = 403"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks:
      - lakehouse-network

  ozone-init:
    <<: *ozone-image
    container_name: demo-ozone-init
    restart: "no"
    command:
      - bash
      - -c
      - |
        set -e
        until ozone sh volume info /s3v >/dev/null 2>&1; do
          ozone sh volume create /s3v >/dev/null 2>&1 || true
          sleep 2
        done
        if ! ozone sh bucket info "/s3v/$${S3_BUCKET_NAME}" >/dev/null 2>&1; then
          ozone sh bucket create "/s3v/$${S3_BUCKET_NAME}" --layout OBJECT_STORE
        fi
        ozone sh bucket info "/s3v/$${S3_BUCKET_NAME}"
    environment:
      <<: *ozone-config
      WAITFOR: om:9874
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-university-lakehouse}
    depends_on:
      s3g:
        condition: service_healthy
    networks:
      - lakehouse-network

  # Trino
  trino:
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lakehouse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lakehouse-secret}
    restart: unless-stopped
    image: trinodb/trino:435
    container_name: demo-trino
    ports:
      - "8081:8080"
    volumes:
      - ./lakehouse/trino/catalog:/etc/trino/catalog
    depends_on:
      ozone-init:
        condition: service_completed_successfully
    networks:
      - lakehouse-network


# Thêm Project Nessie (Iceberg Catalog)
# Thêm Project Nessie (Iceberg Catalog)
  nessie:
    restart: unless-stopped
    image: ghcr.io/projectnessie/nessie:0.104.5  # <-- Đã thêm ghcr.io/ vào đây
    container_name: demo-nessie
    ports:
      - "19120:19120"
    environment:
      - QUARKUS_PROFILE=prod
      - NESSIE_VERSION_STORE_TYPE=JDBC
      - QUARKUS_DATASOURCE_DB_KIND=postgresql
      - QUARKUS_DATASOURCE_JDBC_URL=jdbc:postgresql://postgres:5432/nessie_db
      - QUARKUS_DATASOURCE_USERNAME=postgres
      - QUARKUS_DATASOURCE_PASSWORD=${PG_PASSWORD}
    depends_on:
      - postgres
    networks:
      - lakehouse-network

  # Apache Superset
  superset:
    restart: unless-stopped
    image: apache/superset:3.1.0
    container_name: demo-superset
    ports:
      - "8088:8088"
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY}
    user: "root"
    volumes:
      - superset_home:/app/superset_home
      - ./superset_config.py:/app/pythonpath/superset_config.py
    command: >
      sh -c "
      pip install trino sqlalchemy-trino &&
      superset db upgrade &&
      superset fab create-admin
      --username admin
      --firstname Admin
      --lastname User
      --email admin@fab.org
      --password admin &&
      superset init &&
      /usr/bin/run-server.sh
      "
    depends_on:
      - trino
    networks:
      - lakehouse-network

  # Airflow Init
  airflow-init:
    build:
      context: .
      dockerfile: airflow.Dockerfile
    image: custom-airflow:2.9.2
    container_name: demo-airflow-init
    env_file:
      - .env
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${PG_PASSWORD}@postgres:5432/airflow_db
      _AIRFLOW_DB_UPGRADE: 'true'
      _AIRFLOW_WWW_USER_CREATE: 'true'
      _AIRFLOW_WWW_USER_USERNAME: airflow
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    command: version
    depends_on:
      - postgres
    networks:
      - lakehouse-network

  # Airflow Webserver
  airflow-webserver:
    restart: unless-stopped
    image: custom-airflow:2.9.2
    container_name: demo-airflow-webserver
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${PG_PASSWORD}@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      AIRFLOW__WEBSERVER__CONFIG_FILE: '/opt/airflow/webserver_config.py'
      AIRFLOW__WEBSERVER__WEB_SERVER_SESSION_LIFETIME: '604800'
      # Local Airflow is served over plain HTTP. Browsers reject SameSite=None
      # cookies unless Secure=true, which drops the session and breaks CSRF.
      AIRFLOW__WEBSERVER__SESSION_COOKIE_SAMESITE: 'Lax'
      AIRFLOW__WEBSERVER__SESSION_COOKIE_SECURE: 'False'
      S3_ENDPOINT: 'http://s3g:9878'
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lakehouse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lakehouse-secret}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-university-lakehouse}
      NESSIE_API_URL: 'http://nessie:19120/api/v1'
      TRINO_HOST: 'trino'
      TRINO_PORT: '8080'
      TRINO_HTTP_URL: 'http://trino:8080'
      GX_CONTEXT_ROOT: '/opt/airflow/gx'
      GX_ANALYTICS_ENABLED: 'false'
    volumes:
      - ./airflow_webserver_config.py:/opt/airflow/webserver_config.py:ro
      - ./lakehouse/dags:/opt/airflow/dags
      - ./lakehouse/spark:/opt/airflow/spark
      - ./lakehouse/gx:/opt/airflow/gx
      - ./.env:/opt/airflow/.env
    command: webserver
    depends_on:
      postgres:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
      ozone-init:
        condition: service_completed_successfully
    networks:
      - lakehouse-network

  # Airflow Scheduler
  airflow-scheduler:
    restart: unless-stopped
    image: custom-airflow:2.9.2
    container_name: demo-airflow-scheduler
    env_file:
      - .env
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:${PG_PASSWORD}@postgres:5432/airflow_db
      AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
      AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
      S3_ENDPOINT: 'http://s3g:9878'
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-lakehouse}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-lakehouse-secret}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-university-lakehouse}
      NESSIE_API_URL: 'http://nessie:19120/api/v1'
      TRINO_HOST: 'trino'
      TRINO_PORT: '8080'
      TRINO_HTTP_URL: 'http://trino:8080'
      GX_CONTEXT_ROOT: '/opt/airflow/gx'
      GX_ANALYTICS_ENABLED: 'false'
    volumes:
      - ./lakehouse/dags:/opt/airflow/dags
      - ./lakehouse/spark:/opt/airflow/spark
      - ./lakehouse/gx:/opt/airflow/gx
      - ./.env:/opt/airflow/.env
    command: scheduler
    depends_on:
      postgres:
        condition: service_started
      airflow-init:
        condition: service_completed_successfully
      ozone-init:
        condition: service_completed_successfully
    networks:
      - lakehouse-network

  # ========================================================
  # AIRBYTE INGESTION CORE
  # ========================================================
  airbyte-db:
    profiles: ["airbyte"]
    image: postgres:13-alpine
    container_name: airbyte-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=airbyte
      - POSTGRES_PASSWORD=airbyte
      - POSTGRES_DB=airbyte
    volumes:
      - airbyte_db_data:/var/lib/postgresql/data
    networks:
      - lakehouse-network
    mem_limit: 512m
  airbyte-server:
    profiles: ["airbyte"]
    image: airbyte/server:v0.64.0  # Cập nhật bản mới hỗ trợ Public API
    container_name: airbyte-server
    restart: unless-stopped
    environment:
      - DATABASE_USER=airbyte
      - DATABASE_PASSWORD=airbyte
      - DATABASE_URL=jdbc:postgresql://airbyte-db:5432/airbyte
      - AIRBYTE_ROLE=server
      - WORKSPACE_ROOT=/data
    ports:
      - "8001:8001"                # Expose port REST API cho tool gọi trực tiếp
    depends_on:
      - airbyte-db
    networks:
      - lakehouse-network
    mem_limit: 1500m
  airbyte-worker:
    profiles: ["airbyte"]
    image: airbyte/worker:v0.64.0
    container_name: airbyte-worker
    restart: unless-stopped
    environment:
      - DATABASE_USER=airbyte
      - DATABASE_PASSWORD=airbyte
      - DATABASE_URL=jdbc:postgresql://airbyte-db:5432/airbyte
      - AIRBYTE_ROLE=worker
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - airbyte-server
    networks:
      - lakehouse-network
    mem_limit: 2000m
  airbyte-webapp:
    profiles: ["airbyte"]
    image: airbyte/webapp:v0.64.0
    container_name: airbyte-webapp
    restart: unless-stopped
    ports:
      - "${AIRBYTE_PORT:-8006}:80"  # UI Airbyte Web
    depends_on:
      - airbyte-server
    networks:
      - lakehouse-network
    mem_limit: 256m

volumes:
  postgres_data:
  ozone_scm_data:
  ozone_om_data:
  ozone_recon_data:
  ozone_datanode_1_data:
  ozone_datanode_2_data:
  ozone_datanode_3_data:
  superset_home:
  airbyte_db_data:

networks:
  lakehouse-network:
    driver: bridge
