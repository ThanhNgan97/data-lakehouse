apiVersion: sparkoperator.k8s.io/v1beta2
kind: SparkApplication
metadata:
  name: spark-b2s-{{ ts_nodash | lower }}
  namespace: lakehouse-spark
spec:
  type: Python
  mode: cluster
  image: docker.io/tdang2202/cusc-datalakehouse:spark-3.5.0-v2
  imagePullPolicy: Always
  mainApplicationFile: local:///opt/lakehouse/spark/spark_bronze_to_silver.py
  arguments:
    - --run_id
    - "{{ run_id }}"
  sparkVersion: "3.5.0"

  sparkConf:
    spark.sql.extensions: org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.projectnessie.spark.extensions.NessieSparkSessionExtensions
    spark.sql.catalog.lakehouse: org.apache.iceberg.spark.SparkCatalog
    spark.sql.catalog.lakehouse.catalog-impl: org.apache.iceberg.nessie.NessieCatalog
    spark.sql.catalog.lakehouse.uri: http://host.docker.internal:19120/api/v1
    spark.sql.catalog.lakehouse.ref: main
    spark.sql.catalog.lakehouse.warehouse: s3a://university-lakehouse/iceberg-warehouse
    spark.sql.catalog.lakehouse.cache-enabled: "false"
    spark.hadoop.fs.s3a.impl: org.apache.hadoop.fs.s3a.S3AFileSystem
    spark.hadoop.fs.s3a.endpoint: http://host.docker.internal:9000
    spark.hadoop.fs.s3a.path.style.access: "true"
    spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
    spark.hadoop.fs.s3a.aws.credentials.provider: com.amazonaws.auth.EnvironmentVariableCredentialsProvider
    spark.hadoop.fs.s3a.fast.upload: "true"
    spark.sql.shuffle.partitions: "4"
    spark.sql.parquet.enableVectorizedReader: "false"

  driver:
    cores: 1
    memory: 1g
    serviceAccount: spark-operator-spark
    labels: {}
    env:
      - name: SPARK_EXTRA_JARS_DIR
        value: /opt/spark/jars
      - name: MINIO_ENDPOINT
        value: http://host.docker.internal:9000
      - name: MINIO_BUCKET_NAME
        value: university-lakehouse
      - name: NESSIE_API_URL
        value: http://host.docker.internal:19120/api/v1
      - name: PG_HOST
        value: host.docker.internal
      - name: PG_PORT
        value: "5433"
      - name: PG_DATABASE
        value: university_db
      - name: PG_USER
        value: postgres
      - name: PG_PASSWORD
        valueFrom:
          secretKeyRef:
            name: postgres-credentials
            key: password
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: access-key
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: secret-key
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: access-key
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: secret-key

  executor:
    instances: 2
    cores: 1
    memory: 1g
    labels: {}
    env:
      - name: AWS_ACCESS_KEY_ID
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: access-key
      - name: AWS_SECRET_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: secret-key

  restartPolicy:
    type: Never
